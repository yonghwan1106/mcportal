[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcportal"
version = "0.1.0"
description = "Quota-guarded runtime layer bridging Korean public data APIs (data.go.kr) into the MCP ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yong Park" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.scripts]
# Console entry point for the standard-library-only CLI (mcportal.cli).
# Declaring a script adds no runtime dependency: cli.py imports argparse,
# json, sqlite3 and unicodedata from the standard library only.
mcportal = "mcportal.cli:main"

[project.optional-dependencies]
# Optional MCP conversion layer. The core runtime dependency stays httpx-only;
# fastmcp is required only by mcportal.mcp (spec -> MCP server delegation).
#
# Pinned to the 2.x line on purpose:
#   (a) FastMCP.from_openapi() is a 2.x API and the delegation target,
#   (b) 2.x is httpx-native, which matches the MCPortal runtime stack,
#   (c) the "<3" upper bound physically blocks fresh-install drift into 3.x,
#       where the OpenAPI entrypoint moved to OpenAPIProvider and the HTTP
#       stack changed.
# Measured locally on 2026-08-05: fastmcp 2.14.7 on Python 3.11.9 / httpx 0.28.1
# builds a server and answers a tool call over a replay cassette (no key, no
# network). W4 promotes this to an exact "==" pin plus a lockfile.
# anyio is declared explicitly: mcp.py imports `anyio.to_thread` directly for the
# sync->async transport bridge. httpx pulls anyio in transitively today, but a
# direct import needs a direct declaration (PEP 508) so W4's exact pin + lockfile
# constrains it instead of inheriting whatever httpx happens to resolve.
mcp = ["fastmcp>=2.10,<3", "anyio>=4"]
dev = ["pytest>=8", "respx>=0.21", "fastmcp>=2.10,<3", "anyio>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcportal"]

[tool.hatch.build.targets.sdist]
# wheel 은 packages 로 좁혀 놨지만 sdist 는 기본값이 "gitignore 만 존중하고 리포
# 전체를 담는다" 이므로 게이트가 하나도 없었다. 그 상태로 W4 에서 `python -m build`
# 를 돌리면 presets/(3.26MB) 가 PyPI 로 재배포된다 — 그 안에는 포털 페이지
# 스냅샷(© 행정안전부 All rights reserved)과 관세청 참고문서 xlsx(2.0MB)가 들어
# 있어 데이터셋 이용허락범위와는 별개의 저작권 판단이 필요한 파일들이다.
# 프리셋 번들 4종을 배포에 실을지는 W4 결정 사항이므로, 여기서는 최소한 원문
# 증거물과 벤치마크 결과를 명시적으로 차단해 둔다.
exclude = [
    "presets/_raw",
    "presets/_transcribed",
    "benchmarks/results",
    "dist",
]
