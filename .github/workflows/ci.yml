#
# MCPortal 상시 CI — 설계 §7 표의 ci.yml.
#
# 잡 4개
#   1. test          매트릭스(ubuntu 3.11/3.12 + windows 3.11), 락파일 제약 설치,
#                    pytest + (리눅스 1잡) compile --check
#   2. license-gate  의존 트리 라이선스 덤프 → 허용 목록 밖이면 실패
#   3. secrets       gitleaks 로 커밋 이력 전수 스캔
#   4. sbom          CycloneDX JSON 생성 → 아티팩트 업로드
#
# 네트워크 전제: pytest 는 실호출 0 이 규약이다(카세트·MockTransport 만).
# 러너가 외부로 나가는 곳은 pip 인덱스와 액션 다운로드뿐이다.
#
# 액션 버전 근거(2026-08-09 GitHub Releases API 실측, 전부 prerelease=false):
#   actions/checkout        v7.0.1 (2026-07-20)  https://github.com/actions/checkout/releases
#   actions/setup-python    v7.0.0 (2026-07-20)  https://github.com/actions/setup-python/releases
#   actions/upload-artifact v7.0.1 (2026-04-10)  https://github.com/actions/upload-artifact/releases
#   gitleaks/gitleaks-action v3.0.0 (2026-05-30) https://github.com/gitleaks/gitleaks-action
# 메이저 이동 태그(@v7 등)를 쓴다. 보안을 더 조이려면 커밋 SHA 로 고정한다.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. 테스트 매트릭스
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 한 칸이 깨져도 나머지 칸의 결과를 봐야 원인을 좁힐 수 있다.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          # Windows 칸은 cp949 로케일에서의 파일 입출력을 실제로 밟아 보는 자리다
          # (전역 메모리: 한글 경로/주석 cp949 함정). 그래서 PYTHONIOENCODING 을
          # 일부러 설정하지 않는다 — 설정하면 검증하려던 조건이 사라진다.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # 락파일 기준 설치. 락파일은 requirements/lock-py311.txt 한 개이며
      # 3.12 칸에도 같은 파일을 쓴다(설계 §7). 3.12 에서만 갈라지는 해석이
      # 있으면 그 칸이 먼저 붉어지는 구조라 드리프트가 눈에 띈다.
      #
      # 왜 `-c` 가 아니라 `-r` + `--no-deps` 인가 (2026-08-09 pip 26.2.1 실측)
      # ------------------------------------------------------------------
      # 락파일은 uv 의 --generate-hashes 산출물이라(생성 명령은 락파일 첫 줄에
      # 그대로 적혀 있다) --hash 행을 800여 개 가지고 있다. 락파일을 다시 만들면
      # 흔들리는 수라 정확한 값을 여기 박지 않는다 — 셀 일이 있으면 이렇게 센다:
      #   grep -c -- --hash requirements/lock-py311.txt   # 2026-08-15 실측 823
      # 이걸 -c 로 넘기면 pip 이 해시 검사 모드로 들어가는데,
      # 해시 검사 모드는 "해시를 계산할 파일 하나"를 요구하므로 로컬 디렉터리
      # 요구사항과 같이 못 쓴다. 두 형태 다 즉시 실패한다:
      #
      #   pip install -e ".[dev]" -c .../lock-py311.txt
      #     ERROR: The editable requirement file:///.../mcportal cannot be
      #     installed when requiring hashes, because there is no single file to hash.
      #
      #   pip install ".[dev]" -c .../lock-py311.txt
      #     ERROR: Can't verify hashes for these file:// requirements because
      #     they point to directories: file:///.../mcportal
      #
      # 그래서 순서를 나눈다. 이 편이 원래 안보다 오히려 강하다 — -c 로 넘긴
      # 해시는 "제약"일 뿐이지만, -r 로 넘기면 해시가 실제로 **검증**된다.
      #   1) -r 락파일        : 고정된 의존 그래프를 해시 검증하며 설치
      #   2) -e . --no-deps  : 우리 패키지만 editable 로 얹는다(재해석 없음)
      # 락파일에 mcportal 자기 항목은 없다(uv 가 프로젝트 자신은 빼므로
      # 두 단계가 서로 안 부딪힌다 — 실측 확인).
      - name: 의존성 설치 (락파일, 해시 검증)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/lock-py311.txt
          python -m pip install -e . --no-deps

      - name: 설치된 그래프 기록
        run: python -m pip list

      - name: pytest
        run: python -m pytest -q

      # 컴파일러 결정론 게이트. 커밋된 openapi.json 과 지금 코드가 만들어 내는
      # 바이트가 다르면 exit 3 으로 떨어진다.
      #
      # --presets-root 를 명시하는 이유: curation.default_presets_root() 의 탐색
      # 순서가 ① 환경변수 ② 패키지 데이터(mcportal/presets) ③ 리포 루트 ④ cwd 다.
      # W4 §6-1 이 프리셋을 wheel 에 동봉하면 ② 가 생겨서, 설치본 안의 사본을
      # 검사하고 리포의 드리프트를 놓칠 수 있다. 검사 대상을 체크아웃으로 못박는다.
      - name: compile --check (컴파일러 결정론)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python -m mcportal.cli compile --check --presets-root presets

  # ---------------------------------------------------------------------------
  # 2. 라이선스 게이트 (설계 §7 ② · 리스크 25)
  # ---------------------------------------------------------------------------
  license-gate:
    name: license gate
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 검사 대상 환경과 검사 도구 환경을 분리한다. 같은 환경에 pip-licenses 를
      # 넣으면 그 도구의 의존성이 목록에 섞인다(도구는 자기 자신과 자기 의존성을
      # 제외하지만, 그건 이름 기반 제외라 경계가 흐려진다). --python 으로 대상
      # 인터프리터를 가리키면 우리 의존 트리만 정확히 본다.
      # 설치 형태가 test 잡과 같은 이유는 위 test 잡 주석 참조
      # (해시 락파일은 -c 로 못 쓴다 — -r 로 검증 설치하고 자기 패키지는 --no-deps).
      - name: 대상 환경 구성 (락파일, 해시 검증)
        run: |
          python -m venv .venv-target
          .venv-target/bin/python -m pip install --upgrade pip
          .venv-target/bin/python -m pip install -r requirements/lock-py311.txt
          .venv-target/bin/python -m pip install . --no-deps

      - name: pip-licenses 설치 (격리 환경)
        run: |
          python -m venv .venv-tools
          .venv-tools/bin/python -m pip install --upgrade pip
          .venv-tools/bin/python -m pip install pip-licenses

      # --with-system 은 쓰지 않는다: pip·setuptools 는 venv 부속이지 우리
      # 의존 트리가 아니다. --from=mixed(기본)는 Trove 분류자를 먼저 보고
      # 없으면 메타데이터 License / License-Expression 을 본다.
      - name: 라이선스 덤프
        run: |
          .venv-tools/bin/pip-licenses \
            --python .venv-target/bin/python \
            --from=mixed \
            --with-urls \
            --with-authors \
            --format=json \
            --output-file licenses.json
          echo "--- licenses.json ---"
          cat licenses.json

      # 판정은 인라인 파이썬이다(외부 액션 의존 최소화 — 설계 §7).
      # pip-licenses 의 --allow-only 를 쓰지 않는 이유: 문자열 완전 일치라
      # "Apache-2.0" 과 "Apache Software License" 를 따로 적어야 하고, 왜
      # 떨어졌는지도 안 알려 준다. 여기서는 계열 단위로 판정하고 사유를 찍는다.
      - name: 게이트 판정
        run: |
          python - <<'PY'
          # -*- coding: utf-8 -*-
          """의존 트리 라이선스 게이트.

          허용: Apache · MIT · BSD 계열 · PSF(Python-2.0) · ISC
          차단: GPL · LGPL · AGPL · 미상(UNKNOWN) · 위 목록에 없는 것
          """
          from __future__ import annotations

          import json
          import re
          import sys
          from pathlib import Path

          # 계열 판정은 단어 경계 정규식이다. 부분문자열로 보면 "limited" 안의
          # "mit" 같은 것에 걸린다.
          ALLOW = (
              re.compile(r"\bapache\b", re.I),
              re.compile(r"\bmit\b", re.I),
              re.compile(r"\bexpat\b", re.I),
              re.compile(r"\bbsd\b", re.I),
              re.compile(r"\biscl?\b", re.I),
              re.compile(r"\bpython software foundation\b", re.I),
              re.compile(r"\bpsf(?:-2\.0)?\b", re.I),
              re.compile(r"\bpython-2\.0\b", re.I),
          )
          # 뒤에 v2 · v3 · +  가 붙어도 잡히도록 끝 경계를 두지 않는다.
          DENY = (
              re.compile(r"\b(?:a|l)?gpl", re.I),
              re.compile(r"general public license", re.I),
          )

          # (1) 메타데이터가 비었거나 UNKNOWN 인데 사람이 상류 리포에서 실제
          #     라이선스를 확인한 경우. 형식: 패키지명 -> (확인한 표기, 근거 URL)
          #     기본은 빈 사전 = fail-closed.
          OVERRIDES: dict[str, tuple[str, str]] = {}

          # (2) 허용 계열 목록 밖이지만 검토를 거쳐 받아들인 항목.
          #     형식: 패키지명 -> (정확히 이 표기일 때만 유효, 사유)
          #     라이선스 표기가 한 글자라도 달라지면 예외가 자동으로 풀린다
          #     (상류가 재라이선스하면 다시 붉어져야 한다).
          #     카피레프트(GPL/LGPL/AGPL) 판정에는 이 예외가 **적용되지 않는다.**
          #     2026-08-09 의존 트리 실측으로 걸린 2건이다.
          ACCEPTED_EXCEPTIONS: dict[str, tuple[str, str]] = {
              "certifi": (
                  "Mozilla Public License 2.0 (MPL 2.0)",
                  "httpx 가 끌고 오는 필수 전이 의존성(CA 인증서 번들)이라 제거·"
                  "교체가 불가능하다. MPL-2.0 은 파일 단위 약한 카피레프트라, "
                  "원본 파일을 고치지 않고 그대로 재배포하는 우리 형태에는 "
                  "Apache-2.0 산출물 쪽 의무를 추가하지 않는다. 우리가 certifi "
                  "파일을 수정하는 순간 이 예외는 무효이며 재검토 대상이다.",
              ),
              "email-validator": (
                  "The Unlicense (Unlicense)",
                  "퍼블릭 도메인 헌정이라 MIT 보다 제약이 적다. 카피레프트가 아니다.",
              ),
          }

          SPLIT = re.compile(r"\s*(?:;|,|/|\||\bor\b|\band\b)\s*", re.I)


          def classify(text: str) -> str:
              """라이선스 문자열 하나를 allow / deny / unknown 으로 가른다."""
              for pattern in DENY:
                  if pattern.search(text):
                      return "deny"
              for pattern in ALLOW:
                  if pattern.search(text):
                      return "allow"
              return "unknown"


          def verdict(raw: str) -> tuple[bool, str]:
              """복수 라이선스 표기를 조각내 판정한다.

              한 조각이라도 허용 계열이면 통과다(듀얼 라이선스는 허용 쪽을
              고를 수 있다). 허용 조각이 하나도 없으면 실패다.
              """
              parts = [p.strip() for p in SPLIT.split(raw) if p.strip()]
              if not parts:
                  return False, "라이선스 표기 없음"
              kinds = [classify(p) for p in parts]
              if "allow" in kinds:
                  if "deny" in kinds:
                      return True, "듀얼 라이선스(허용 계열 선택 가능)"
                  return True, "허용 계열"
              if "deny" in kinds:
                  return False, "카피레프트(GPL/LGPL/AGPL) 계열"
              return False, "허용 목록에 없음 또는 미상"


          rows = json.loads(Path("licenses.json").read_text(encoding="utf-8"))
          failures: list[str] = []
          notes: list[str] = []
          used_exceptions: set[str] = set()

          print(f"검사 대상 {len(rows)}개 패키지")
          print("-" * 72)
          for row in sorted(rows, key=lambda r: r["Name"].lower()):
              name = row["Name"]
              raw = (row.get("License") or "").strip()
              source = "metadata"
              if name in OVERRIDES:
                  raw, url = OVERRIDES[name]
                  source = f"override <{url}>"
              if not raw or raw.upper() == "UNKNOWN":
                  failures.append(f"{name} {row['Version']}: 라이선스 미상(UNKNOWN)")
                  print(f"  FAIL  {name:30s} UNKNOWN")
                  continue

              ok, why = verdict(raw)

              # 예외 적용. 카피레프트 판정에는 절대 적용하지 않는다 —
              # GPL/LGPL/AGPL 은 어떤 예외로도 통과할 수 없어야 한다.
              if not ok and why != "카피레프트(GPL/LGPL/AGPL) 계열":
                  allowed_text, reason = ACCEPTED_EXCEPTIONS.get(name, ("", ""))
                  if allowed_text and allowed_text == raw:
                      used_exceptions.add(name)
                      ok, source = True, "검토된 예외"
                      why = "예외 승인"
                      notes.append(f"{name} ({raw}): {reason}")

              mark = "ok  " if ok else "FAIL"
              print(f"  {mark}  {name:30s} {raw}  [{why}; {source}]")
              if not ok:
                  failures.append(f"{name} {row['Version']}: {raw} -> {why}")
              elif why.startswith("듀얼"):
                  notes.append(f"{name}: {raw} (허용 계열을 선택할 수 있음)")

          print("-" * 72)
          for note in notes:
              print(f"참고: {note}")

          # 더 이상 안 걸리는 예외는 목록에서 빼야 한다(사유가 낡은 채로
          # 남아 있으면 다음 사람이 근거 없는 예외를 물려받는다).
          stale = sorted(set(ACCEPTED_EXCEPTIONS) - used_exceptions)
          if stale:
              print()
              print("참고: 이번 트리에서 쓰이지 않은 예외 항목 — 정리 후보")
              for name in stale:
                  print(f"  - {name}")

          if failures:
              print()
              print("라이선스 게이트 실패:")
              for line in failures:
                  print(f"  - {line}")
              print()
              print("해소 방법 중 하나를 고른다:")
              print("  1) 해당 의존성을 제거하거나 허용 계열로 교체한다.")
              print("  2) 메타데이터만 비어 있고 실제로는 허용 계열이면,")
              print("     상류 리포에서 확인한 뒤 OVERRIDES 에 근거 URL과 함께 등록한다.")
              print("  3) 카피레프트가 아니고 재배포에 지장이 없다고 판단되면,")
              print("     ACCEPTED_EXCEPTIONS 에 정확한 표기와 사유를 적어 등록한다.")
              print("     GPL/LGPL/AGPL 은 이 경로로 통과시킬 수 없다.")
              sys.exit(1)

          print()
          print(f"라이선스 게이트 통과 — {len(rows)}개 패키지 전부 허용 계열.")
          PY

  # ---------------------------------------------------------------------------
  # 3. 시크릿 스캔 (설계 §7 ③)
  # ---------------------------------------------------------------------------
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 = 전체 이력. 얕은 클론이면 과거 커밋에 박힌 키를 못 본다.
      # 이 리포의 최대 사고 시나리오가 "카세트 스크러빙 누락"이라 이력 전수가 필수다.
      - name: 체크아웃 (전체 이력)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # v2 는 2026-06 이후 환경변수 우회가 필요하고 2026-09 에 완전히 동작을
      # 멈춘다(액션 README 의 v2->v3 마이그레이션 안내). 그래서 v3 을 쓴다.
      # 입출력·동작은 v2 와 동일하고 런타임만 Node 20 -> Node 24 다.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 설정 파일명이 점으로 시작해서(.gitleaks.toml) 액션의 루트 자동
          # 탐지(gitleaks.toml)에 안 걸린다. 명시 지정한다.
          GITLEAKS_CONFIG: .gitleaks.toml
          # 액션의 기본 다운로드 버전이 루트 [[allowlists]] 복수형 문법을 모르는
          # 8.24.3 으로 내려와 등재값이 무시됐다(2026-08-09 첫 실행 실측 —
          # 로컬 검증은 8.30.1 이었다). 로컬 검증 버전과 동일하게 고정한다.
          GITLEAKS_VERSION: "8.30.1"
          # GITLEAKS_LICENSE 는 조직 계정 리포에만 필요하다. yonghwan1106 은
          # 개인 계정이라 불필요(액션 README FAQ).
          #
          # PR 코멘트 기능은 끈다. 이 워크플로의 토큰 권한은 contents: read 이고,
          # 포크에서 온 PR 의 토큰은 어차피 읽기 전용이라 코멘트 시도가 실패
          # 조건이 된다 — 유출이 없는데 잡이 붉어지는 경로를 만들지 않는다.
          # 검출 결과는 잡 요약(GITLEAKS_ENABLE_SUMMARY 기본 on) · SARIF
          # 아티팩트(GITLEAKS_ENABLE_UPLOAD_ARTIFACT 기본 on) · 종료 코드로 전달된다.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ---------------------------------------------------------------------------
  # 4. SBOM (설계 §7 ④)
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: 파이썬 준비
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 라이선스 게이트와 같은 이유로 환경을 둘로 나눈다. cyclonedx-bom 을 대상
      # 환경에 넣으면 그 도구의 의존성이 SBOM 부품 목록에 그대로 실린다.
      # 설치 형태는 test·license-gate 잡과 같다(위 주석 참조).
      - name: 대상 환경 구성 (락파일, 해시 검증)
        run: |
          python -m venv .venv-target
          .venv-target/bin/python -m pip install --upgrade pip
          .venv-target/bin/python -m pip install -r requirements/lock-py311.txt
          .venv-target/bin/python -m pip install . --no-deps

      - name: cyclonedx-bom 설치 (격리 환경)
        run: |
          python -m venv .venv-tools
          .venv-tools/bin/python -m pip install --upgrade pip
          .venv-tools/bin/python -m pip install cyclonedx-bom

      # cyclonedx-py 는 cyclonedx-bom 배포판이 설치하는 실행 파일 이름이다.
      # environment 하위명령은 가상환경 경로를 인자로 받는다.
      # --output-reproducible 은 실행마다 바뀌는 타임스탬프·serialNumber 를 빼서
      # 같은 입력이면 같은 바이트가 나오게 한다(스냅샷 비교 가능).
      - name: CycloneDX JSON 생성
        run: |
          .venv-tools/bin/cyclonedx-py environment .venv-target \
            --output-format JSON \
            --spec-version 1.6 \
            --output-reproducible \
            --output-file mcportal.cdx.json
          python -c "import json,pathlib; d=json.loads(pathlib.Path('mcportal.cdx.json').read_text(encoding='utf-8')); print('components:', len(d.get('components', [])))"

      # 리포에 커밋되는 sbom/ 스냅샷(릴리스 시점 산출물)과는 별개다.
      # 여기서 만든 것은 매 실행분 아티팩트라 드리프트 비교를 하지 않는다(설계 §7).
      - name: SBOM 아티팩트 업로드
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx-json
          path: mcportal.cdx.json
          if-no-files-found: error
          retention-days: 30
